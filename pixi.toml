[workspace]
channels = ["conda-forge"]
platforms = [{platform = "linux-64", glibc = "2.17"}]
preview = ["pixi-build"]


[package]
name = "cditools"
version = "0.2.0.dev0"

[package.build]
backend = { name = "pixi-build-python", version = "*" }

[package.build.config]
ignore-pyproject-manifest = false
ignore-pypi-mapping = false  # Enable automatic PyPI-to-conda mapping

[dependencies]
cditools = { path = "." }

[feature.test.dependencies]
entrypoints = ">=0.4,<0.5"
pytest = ">=9.1.1,<10"
pytest-cov = ">=7.1.0,<8"
pytest-asyncio = ">=1.4.0,<2"
caproto = ">=1.3.0,<2"
tiled-client = ">=0.2.14,<0.3"
tiled-server = ">=0.2.14,<0.3"
hdf5plugin = ">=7.0.0,<8"

[feature.test.tasks]
tests = "pytest"

[feature.dev.dependencies]
caproto = ">=1.3.0,<2"
pytest = ">=9.1.1,<10"
pytest-cov = ">=7.1.0,<8"
pytest-asyncio = ">=1.4.0,<2"
pandas = ">=3.0.3,<4"
pre-commit = ">=4.6.1,<5"
ipython = ">=9.15.0,<10"
ruff = ">=0.16.0,<0.17"
tiled-client = ">=0.2.14,<0.3"
tiled-server = ">=0.2.14,<0.3"

pyright = ">=1.1.411,<2"
twine = ">=7.0.0,<8"


[feature.docs.dependencies]
sphinx = ">=9.1.0,<10"
myst-parser = ">=5.1.0,<6"
sphinx-copybutton = ">=0.5.2,<0.6"
sphinx-autodoc-typehints = ">=3.13.0,<4"
furo = ">=2025.12.19,<2026"


[feature.docs.tasks]
docs = "sphinx-build -T -b html -d docs/_build/doctrees -D language=en docs docs/_build/html"


[environments]
default = { solve-group = "default" }
dev = { features = ["dev"], solve-group = "default" }
docs = { features = ["docs"], solve-group = "default" }
test = { features = ["test"], solve-group = "default" }
