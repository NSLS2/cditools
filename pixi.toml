[workspace]
channels = ["conda-forge"]
platforms = [{platform = "linux-64", glibc = "2.17"}]
preview = ["pixi-build"]


[package]
name = "cditools"
version = "0.2.0.dev0"

[package.build]
backend = { name = "pixi-build-python", version = "*" }

[package.build.config]
ignore-pyproject-manifest = false
ignore-pypi-mapping = false  # Enable automatic PyPI-to-conda mapping

[dependencies]
cditools = { path = "." }

[feature.test.dependencies]
entrypoints = "*"
pytest = ">=6"
pytest-cov = ">=3"
pytest-asyncio = ">=0.18"
caproto = ">=0.4.2rc1,!=1.2.0"
tiled-client = "*"
tiled-server = "*"
ophyd = ">=1.10.6"
hdf5plugin = ">=7.0.0,<8"

[feature.test.tasks]
tests = "pytest"

[feature.dev.dependencies]
caproto = ">=0.4.2rc1,!=1.2.0"
pytest = ">=6"
pytest-cov = ">=3"
pytest-asyncio = ">=0.18"
pandas = "*"
pre-commit = "*"
ipython = "*"
ruff = "*"
aioca = "*"
tiled-client = "*"
tiled-server = "*"

pyright = "*"
ophyd = ">=1.10.6"
twine = "*"


[feature.docs.dependencies]
sphinx = ">=7.0"
myst-parser = ">=0.13"
sphinx-copybutton = "*"
sphinx-autodoc-typehints = "*"
furo = ">=2023.08.17"


[feature.docs.tasks]
docs = "sphinx-build -T -b html -d docs/_build/doctrees -D language=en docs docs/_build/html"


[environments]
default = { solve-group = "default" }
dev = { features = ["dev"], solve-group = "default" }
docs = { features = ["docs"], solve-group = "default" }
test = { features = ["test"], solve-group = "default" }
